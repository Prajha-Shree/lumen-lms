name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lms_owner
          POSTGRES_PASSWORD: lms_owner_dev_password
          POSTGRES_DB: lms
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U lms_owner -d lms"
          --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Create least-privilege app role (mirrors docker/postgres/init)
        env:
          PGPASSWORD: lms_owner_dev_password
        run: psql -h localhost -p 5433 -U lms_owner -d lms -c "CREATE ROLE lms_app LOGIN PASSWORD 'lms_app_dev_password' NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE;"
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      # Includes tenant-isolation (RLS), auth, recommendation and proctoring suites.
      - run: npm test

  ml-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt -r requirements-cv.txt
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
